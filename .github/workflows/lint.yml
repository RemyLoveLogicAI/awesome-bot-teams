name: Validate & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Team Schemas
        run: |
          python3 init-team.py --validate

      - name: Test Multi-Framework Code Generators
        run: |
          python3 init-team.py --list
          python3 init-team.py --template software-engineering-squad --export json
          python3 init-team.py --template software-engineering-squad --export yaml
          python3 init-team.py --template multi-model-debate-pod --export crewai
          python3 init-team.py --template solo-founder-cockpit --export autogen
          python3 init-team.py --template cyber-security-redteam --export langgraph
          python3 init-team.py --template zero-trust-autonomous-squad --export crewai
          python3 init-team.py --template zero-trust-autonomous-squad --export autogen
          python3 init-team.py --template zero-trust-autonomous-squad --export langgraph

      - name: Verify Documentation & Asset Links
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/CLI_REFERENCE.md
          test -f docs/TEMPLATE_GUIDELINES.md
          test -f docs/SAFETY_AND_GOVERNANCE.md
          test -f docs/PRODUCTION_STANDARD.md
          test -f CITATION.cff
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          echo "All core documentation assets verified!"
