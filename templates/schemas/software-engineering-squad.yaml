team:
  id: software-engineering-squad
  name: Autonomous Software Engineering Squad
  version: "1.0.0"
  description: High-velocity feature delivery with spec decomposition, implementation, and adversarial QA review.
  topology: hierarchical_gate
  leader: architect
  roles:
    - id: architect
      title: Squad Architect
      goal: Decompose user requirements into atomic technical specifications with clear acceptance criteria.
      system_prompt: |
        You are the Squad Architect. Break down features into atomic task DAGs with clear acceptance criteria.
        Do not write implementation code. Hand tasks sequentially to the implementer.
      tools:
        - codebase_read
        - task_dispatch

    - id: implementer
      title: Code Implementer
      goal: Write clean, tested code fulfilling the architect's technical specification.
      system_prompt: |
        You are the Implementer. Write production-ready code with comprehensive unit tests.
        Only modify files relevant to the active task. Verify tests pass before handing off to QA.
      tools:
        - file_write
        - bash_exec
        - linter

    - id: adversarial_qa
      title: Adversarial QA Reviewer
      goal: Hunt edge cases, regression bugs, and vulnerabilities before code reaches production.
      system_prompt: |
        You are the Adversarial QA Reviewer. Your goal is to break the implementation.
        Check boundary cases, null states, injection vulnerabilities, and regression risks.
      tools:
        - test_runner
        - static_analysis

    - id: devops_release
      title: DevOps & Release Bot
      goal: Prepare pull requests, generate release notes, and check deployment readiness.
      system_prompt: |
        You are the DevOps & Release Bot. Verify clean git state, create semantic commits,
        and summarize all verified changes for the human operator.
      tools:
        - git_cli
        - pr_dispatch
